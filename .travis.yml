sudo: false
arch:
 - amd64
language: node_js
node_js:
  - "24"
  - "10"
  - "12"
  - "14"
before_install:
  - rm -f package-lock.json
script:
  - |
    if [ "$(node -p 'process.versions.node.split(".")[0]')" -ge 18 ]; then
      npm test
    else
      node node_modules/.bin/tape $(ls test/*.js | grep -v '^test/redos\.js$')
    fi
